<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06101f" />
    <title>故事档案馆 · 知乎故事现场推理</title>
    <meta name="description" content="进入知乎故事的现场，观察物品，与角色交谈，寻找被遗漏的关键线索。一座收藏未解故事的推理档案馆。" />
    <!-- 图标：以前完全没有 favicon，浏览器标签上是一个破图。
         .ico 管标签页和书签，512 的 png 给高分屏，apple-touch-icon 给 iOS 加到主屏。 -->
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./assets/app-icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <!-- 以前这里挂过 Google Fonts 的 Noto Sans SC。去掉了，两个原因：
         ① 它是 <link rel=stylesheet>，属于**阻塞渲染**的资源 —— 在境内多半连不上，
            浏览器要等到超时才继续，评委打开首页会先白屏几秒；
         ② 本来就不缺字体：menu.css / styles.css 的字体栈是
            "Noto Sans SC", system-ui, sans-serif，中文自动落到系统字体
            （macOS 是苹方，Windows 是微软雅黑），字形只会更好看，不会更差。 -->
    <!-- 版本号 v=… 是破缓存用的：这些 css/js 在服务器上缓存 24 小时，
         改了文件就必须把这个日期递增一次，否则老访客会继续用旧文件。
         （踩过：加了背景音乐和 ?intro=cg1 之后，回访的人仍然没有音乐和开场动画。） -->
    <link rel="stylesheet" href="./menu.css?v=20260913f" />
    <link rel="stylesheet" href="./home-v2.css?v=20260913f" />
    <link rel="stylesheet" href="./zhihu-login.css?v=20260914d" />
    <!-- 手上设备的判定要在**任何会碰视频的脚本之前**加载：桌面注入视频源并起播，
         手机什么都不做（原因见 handheld.js 顶部那段）。 -->
    <script src="./handheld.js?v=20260914e"></script>
  </head>
  <body>
    <!-- 首页背景分三层，从下往上：
         ① .world 自己的 background-image —— 兜底，也是第一帧；
         ② .world-drift —— 同一张图的纯 CSS 缓慢推镜，**只要图片到了就一定在动**；
         ③ .world-video —— 循环视频，只有真的开始播才淡入（见 menu.js）。
         为什么加第 ② 层：公网实测，那个 1 MB 的视频请求 16.9 秒才回响应头、
         之后 38 秒一个字节都没到（curl 走同一链路却 1.5 秒下完），
         于是页面只剩静止封面，看起来像「没有背景视频」。
         第 ② 层零额外下载、无编解码、无自动播放策略，Windows/Mac/手机都一样。

         ⚠️ 2026-09-14 起：**源不写在这里**，改由 menu.js 在桌面端注入（见 data-src）。
         原因是手机上（尤其微信）**一个字节都不该下、更不该自己播** ——
         微信/安卓内核会把 <video> 接管成全屏播放器，把整页连同登录门一起盖住
         （用户实测：点「用知乎账号登录」，出来的是一个 5 秒的视频）。
         playsinline / webkit-playsinline / x5-playsinline / x5-video-player-type
         是给各家用得上的「同层播放」开关，防的就是这类接管。 -->
    <div class="world" aria-hidden="true"><div class="world-drift" aria-hidden="true"></div><video class="world-video" loop muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" preload="none" data-src="./assets/hall-menu-loop-10s-5refs.mp4" poster="./assets/story-archive-menu.jpg" aria-hidden="true"></video></div><div class="shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="shell">
      <header class="masthead"><a class="brand" href="./" aria-label="知乎——你是否问到了关键线索，首页">知乎<span>故事里的另一种可能</span></a><div class="utilities"><span class="zhihu-slot" id="zhihu-slot"></span><button class="icon-button" id="audio" aria-label="开启背景音乐与音效" aria-pressed="false">♪ <span>声音关</span></button><button class="icon-button" id="settings" aria-label="打开设置">⚙ <span>设置</span></button></div></header>
      <main>
        <section class="opening" aria-labelledby="game-title">
          <div class="eyebrow"><i></i> 一场从提问开始的悬疑冒险</div>
          <h1 id="game-title"><span class="sr-only">知乎——</span>你是否问到了<br><em>关键线索</em><span class="question-mark">？</span></h1>
          <p class="lead">每个人都说了一部分。<br>剩下的，等你来问。</p>
          <nav class="menu" aria-label="游戏主菜单"><button class="primary" data-open="chapters"><span>选择故事</span><span aria-hidden="true">↗</span></button><button class="text-button" data-open="guide"><span class="menu-index">02</span> 调查员须知 <span aria-hidden="true">＋</span></button><button class="text-button" data-open="sources"><span class="menu-index">03</span> 故事从何而来 <span aria-hidden="true">＋</span></button></nav>
        </section>
        <button class="door-hotspot archive-hotspot" data-open="chapters" aria-label="翻开故事档案，选择关卡"><span class="crosshair">＋</span><span>故事档案<span class="hotspot-hint">翻开一个未解的故事</span></span></button>
        <aside class="whisper" id="whisper" aria-live="polite">每一个故事，都有尚未问出口的问题。</aside>
        <section class="bottom-rail" aria-label="第一章与调查员">
          <button class="chapter-teaser" data-open="case"><span class="chapter-number">01</span><span class="chapter-text"><small>第一章 · 旧公寓</small><strong>蓝血</strong></span><span class="chapter-state">查看案件简介 <span aria-hidden="true">↗</span></span></button>
          <!-- 这里显示只有 76×76，但官方原始 GIF 是 320×320 / 951 KB —— 一份动图
               比整个首页的 CSS+JS 加起来还重。换成等比缩到 160px 的那份（207 KB，
               实测缩了 78%，肉眼看不出差别）。320 的原件留着，给旧版演示页用，
               那一页把看山放到 450px 宽。 -->
          <div class="investigator"><img src="./assets/kanshan-idle-160.gif" alt="刘看山" width="76" height="76"/><div><small>你的调查员</small><strong>刘看山</strong></div><span class="investigator-line"></span><p>别急着相信，<br>再问一句。</p></div>
        </section>
      </main>
      <footer><span>观察 · 追问 · 还原</span><span>故事档案馆</span></footer>
    </div>
    <dialog id="panel" aria-labelledby="panel-title"><div class="dialog-bar"><span>调查档案 / <span id="panel-kind">01</span></span><button id="close-panel" class="icon-button" aria-label="关闭窗口">✕</button></div><div id="panel-body"></div></dialog>
    <audio id="bgm-piano" preload="auto" loop src="./assets/bgm-piano.mp3"></audio>
    <audio id="ui-soft-chime" preload="auto" src="./assets/ui-soft-chime.mp3"></audio>
    <script src="./menu.js?v=20260914e"></script>
    <!-- 登录门 · **入口档**（data-gate="1"）：公网域名上先请你登记一下，
     但门上留了「先以访客身份进入」当出口 —— 档案馆可以逛、可以看展陈和说明书。
     具体游戏内容（第一幕现场 room.html）是**现场档** data-gate="locked"，那里不给访客留门。
     本地地址（localhost/局域网）不设门，否则开发者自己都被关在门外 —— 见 zhihu-login.js 顶部第 3 条。 -->
    <script src="./zhihu-login.js?v=20260914d" data-gate="1"></script>
  </body>
</html>
